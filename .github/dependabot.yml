# Norma común de Piensaenweb para actualizaciones de dependencias.
# - Lunes por la mañana: una sola PR por ecosistema con parches y menores.
# - Versiones mayores: una PR por dependencia, con tope; se revisan a mano.
# - Nada se fusiona solo. Los avisos de seguridad llegan aparte, en cuanto salen.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /frontend
      - /backend
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 4
    labels: [dependencias]
    groups:
      parches-y-menores:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    labels: [dependencias]
    groups:
      parches-y-menores:
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    labels: [dependencias]
    groups:
      parches-y-menores:
        update-types: [minor, patch]
